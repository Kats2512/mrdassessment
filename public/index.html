<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr D Finder</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="fw-bold display-5 mb-2">🍔 Mr D Finder</h1>
            <p class="text-secondary fs-5">Search by name, restaurant or category</p>
        </header>

        <!-- Search + filter + sort -->
        <div class="row justify-content-center g-2 mb-4">
            <div class="col-md-6 col-lg-5 position-relative">
                <input type="search" id="search-input" class="form-control form-control-lg"
                    placeholder="Try burger, pizza, Flame Grill..." aria-label="Search items" autocomplete="off"
                    autofocus />
                <div id="typeahead-results" class="typeahead-menu d-none"></div>
            </div>
            <div class="col-6 col-md-3 col-lg-2">
                <select id="category-select" class="form-select form-select-lg" aria-label="Category">
                    <option value="">All categories</option>
                </select>
            </div>
            <div class="col-6 col-md-3 col-lg-2">
                <select id="sort-select" class="form-select form-select-lg" aria-label="Sort by">
                    <option value="popularity">Popular</option>
                    <option value="price_asc">Price: low to high</option>
                    <option value="price_desc">Price: high to low</option>
                    <option value="name">Name A-Z</option>
                </select>
            </div>
        </div>

        <p id="result-count" class="text-center text-secondary mb-4"></p>

        <div id="loading" class="text-center d-none my-5">
            <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="item-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 justify-content-center">
        </div>

        <nav class="mt-5 d-flex justify-content-center" aria-label="Pages">
            <ul id="pager" class="pagination mb-0"></ul>
        </nav>
    </div>

    <script src="index.js" defer></script>
</body>

</html>
